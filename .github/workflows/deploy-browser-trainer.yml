name: Deploy browser trainer

on:
  push:
    branches:
      - main
      - codex/repository-audit-cleanup
    paths:
      - ".github/workflows/deploy-browser-trainer.yml"
      - "web/dynaworld_browser_trainer/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dynaworld_browser_trainer
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
