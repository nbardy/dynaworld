name: Deploy browser trainer

on:
  push:
    branches:
      - main
      - codex/repository-audit-cleanup
    paths:
      - ".github/workflows/deploy-browser-trainer.yml"
      - "web/dynaworld_browser_trainer/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source
      - name: Check out Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publish
      - name: Publish static browser subtree
        run: |
          rsync -a --delete --exclude .git/ source/web/dynaworld_browser_trainer/ publish/
          cd publish
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "Pages branch is already current."
          else
            git commit -m "Deploy browser trainer ${GITHUB_SHA::12}"
            git push origin HEAD:gh-pages
          fi
