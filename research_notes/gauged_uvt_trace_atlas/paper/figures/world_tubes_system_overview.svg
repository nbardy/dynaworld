.input { fill: #f8fafc; stroke: #64748b; stroke-width: 1.8; }
.replay { fill: #fff1f2; stroke: #fb7185; stroke-width: 1.6; }
.compile { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.8; }
