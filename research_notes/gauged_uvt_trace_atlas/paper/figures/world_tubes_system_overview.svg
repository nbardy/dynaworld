<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">World Tubes camera-program compiler and compiled adjoint</title>
<desc id="figure-description">The Same learned world and Known camera program enter Per-frame replay or World Tubes compilation. A Camera-program compiler produces a Projective trace atlas and Certified tile-time cells for the Metal interval forward, Metal interval VJP, Compiler VJP, and World gradients.</desc>
<style>.background { fill: #ffffff; }
.title { fill: #0f172a; font-family: Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 700; }
.subtitle { fill: #475569; font-family: Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 400; }
.lane-title { fill: #0f172a; font-family: Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 700; }
