[project]
name = "dynaworld"
version = "0.1.0"
description = "Local TokenGS experiments"
requires-python = ">=3.11,<3.13"
dependencies = [
    "einops>=0.8.2",
    "opencv-python",
    "pillow",
    "requests",
    "taichi",
    "timm>=1.0.26",
    "torch",
    "tqdm",
    "wandb",
]

[dependency-groups]
experiments = [
    "beartype",
    "gradio>=6.12.0",
    "moviepy>=2.2.1",
    "packaging",
    "roma",
    "tensordict>=0.7.0",
    "torchvision",
]
vjepa-hf = [
    "transformers @ git+https://github.com/huggingface/transformers",
]

[tool.uv]
package = false
